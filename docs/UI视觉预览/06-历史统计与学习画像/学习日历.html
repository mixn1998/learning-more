<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Learning MORE · 学习日历</title><link rel="icon" href="data:,">
  <link rel="stylesheet" href="../00-设计系统/assets/base.css">
  <style>
    .hero{padding:22px 24px}.hero h1{margin:5px 0 4px;font-size:27px}.hero p{margin:0;color:var(--muted);font-size:12px}.top-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.history-tab{height:52px;border:1px solid #d8c8b5;border-radius:11px;background:var(--paper);color:var(--muted);font-size:14px;font-weight:800;text-decoration:none;display:flex;align-items:center;justify-content:center}.history-tab:hover{border-color:var(--accent);color:var(--accent-dark)}.history-tab.active{border-color:var(--accent);background:var(--tint);color:var(--accent-dark);box-shadow:inset 0 -3px 0 var(--accent)}
    .calendar-card{margin-top:14px;padding:24px}.calendar-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px}.month-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.month-head h2{margin:0;font-size:25px}.month-head p{margin:5px 0 0;color:var(--muted);font-size:12px}.month-controls{display:flex;align-items:center;gap:8px}.month-controls b{min-width:126px;text-align:center;font-size:18px}.month-controls .lm-btn{width:42px;padding:0}.weekdays,.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}.weekdays span{text-align:center;font-size:11px;color:var(--muted)}.date{min-width:0;min-height:120px;padding:10px;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:#fff;text-align:left;cursor:pointer}.date>b{font-size:15px}.date.active{border-color:var(--accent);background:var(--tint);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 12%,transparent)}.date.muted{color:#aaa096;background:#fbf8f3}.date-course{display:block;max-width:100%;margin-top:6px;padding:5px 6px;border-radius:5px;background:#f4ede4;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.day-detail{padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--paper-2)}.day-detail h3{margin:0 0 10px;font-size:22px}.record{width:100%;margin-top:10px;padding:13px;border:1px solid var(--line);border-radius:9px;background:#fff;text-align:left;cursor:pointer}.record b{font-size:11px}.record small{font-size:10px;color:var(--muted)}.empty-detail{margin-top:12px;padding:18px;border:1px dashed var(--line);border-radius:9px;color:var(--muted);font-size:11px}@media(max-width:900px){.calendar-layout{grid-template-columns:1fr}}@media(max-width:620px){.top-tabs{grid-template-columns:1fr}.calendar-card{padding:12px}.month-head{align-items:flex-start;flex-direction:column;gap:12px}.weekdays,.calendar{gap:4px}.weekdays span{font-size:9px}.date{min-height:68px;padding:6px}.date>b{font-size:12px}.date-course{padding:3px;font-size:7px}.date-course:nth-of-type(n+2){display:none}}
  </style>
<script defer src="../00-设计系统/assets/runtime-status.js"></script><script defer src="../00-设计系统/assets/sample-ui.js"></script></head>
<body>
  <header class="lm-topbar"><div class="lm-brand"><strong>Learning MORE</strong><span>学习日历</span></div><div class="lm-actions"><span class="lm-pill">● 接口 · Codex</span><a class="lm-btn" href="../01-主页与全局导航/主页.html">返回主页</a></div></header>
  <main class="lm-page">
    <section class="lm-card hero"><div class="lm-kicker">LEARNING CALENDAR</div><h1>学习日历</h1></section>
    <nav class="top-tabs"><a class="history-tab" href="历史统计.html">历史统计</a><a class="history-tab active" href="学习日历.html">学习日历</a><a class="history-tab" href="学习画像.html">学习画像</a></nav>
    <section class="lm-card calendar-card"><div class="calendar-layout"><div><div class="month-head"><div><h2>学习日历</h2><p>4 个学习日 · 6 节已完成课节</p></div><div class="month-controls"><button class="lm-btn" aria-label="上个月">‹</button><b>2026 年 7 月</b><button class="lm-btn" aria-label="下个月">›</button></div></div><div class="weekdays"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div class="calendar" id="calendarGrid"></div></div><aside class="day-detail"><h3 id="dateTitle">7 月 10 日</h3><span class="lm-pill" id="completedCount">2 节已完成</span><div id="dateRecords"><button class="record" onclick="location.href='../05-Review与学习档案/课节记录.html'"><b>核心循环如何形成持续动机</b><br><small>游戏设计 · 20 分钟</small></button><button class="record" onclick="location.href='../05-Review与学习档案/课节记录.html'"><b>链表如何改变插入代价</b><br><small>计算机科学 · 31 分钟</small></button></div></aside></div></section>
  </main>
  <script>
    const learned={3:['反馈不是奖励动画'],6:['数组为什么能够随机访问'],10:['核心循环如何形成持续动机','链表如何改变插入代价'],17:['树的层级关系','为原型建立成功标准']};
    const details={3:[['反馈不是奖励动画','游戏设计 · 24 分钟']],6:[['数组为什么能够随机访问','计算机科学 · 31 分钟']],10:[['核心循环如何形成持续动机','游戏设计 · 20 分钟'],['链表如何改变插入代价','计算机科学 · 31 分钟']],17:[['树的层级关系','计算机科学 · 28 分钟'],['为原型建立成功标准','产品设计 · 18 分钟']]};
    calendarGrid.innerHTML=Array.from({length:34},(_,index)=>{if(index<3)return `<div class="date muted"><b>${29+index}</b></div>`;const day=index-2;return `<button class="date ${day===10?'active':''}" data-day="${day}"><b>${day}</b>${(learned[day]||[]).map(name=>`<span class="date-course">${name}</span>`).join('')}</button>`}).join('');
    calendarGrid.querySelectorAll('button.date').forEach(button=>button.addEventListener('click',()=>{calendarGrid.querySelectorAll('button.date').forEach(item=>item.classList.toggle('active',item===button));const day=Number(button.dataset.day);const rows=details[day]||[];dateTitle.textContent=`7 月 ${day} 日`;completedCount.textContent=`${rows.length} 节已完成`;dateRecords.innerHTML=rows.length?rows.map(row=>`<button class="record" onclick="location.href='../05-Review与学习档案/课节记录.html'"><b>${row[0]}</b><br><small>${row[1]}</small></button>`).join(''):'<div class="empty-detail">当天暂无已归档课节</div>';}));
  </script>
</body>
</html>
