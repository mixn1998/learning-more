<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learning MORE · 九模式视觉身份</title><link rel="icon" href="data:,"><link rel="stylesheet" href="assets/base.css"><style>.tokens{grid-template-columns:repeat(3,1fr)}.token{padding:18px}.token-head{display:flex;gap:12px;align-items:center}.token h2{font-size:15px;margin:0}.token p{font-size:10px;color:var(--muted)}.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:13px}.swatch{height:42px;border-radius:8px;border:1px solid var(--line)}.levels{margin-top:18px;padding:18px}.level-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.level{padding:15px;border:1px solid var(--line);border-radius:11px}.level strong{font-size:11px}.level p{font-size:9px;color:var(--muted)}@media(max-width:800px){.tokens,.level-grid{grid-template-columns:1fr}}</style><script defer src="assets/runtime-status.js"></script></head><body><header class="lm-topbar"><div class="lm-brand"><strong>Learning MORE</strong><span>九模式视觉身份注册表</span></div><a class="lm-btn" href="../README.md">返回索引</a></header><main class="lm-page"><div class="lm-section-title"><div><div class="lm-kicker">Design system</div><h1>九模式视觉身份</h1><p>模式只表达课程来源身份；状态色继续表达成功、警告、错误和只读。</p></div></div><div class="lm-grid tokens" id="tokens" style="margin-top:16px"></div><section class="lm-card levels"><h2>渐进式身份强度</h2><div class="level-grid"><div class="level"><strong>创建 · 强</strong><p>整卡、图标、输入区和用户气泡使用模式色。</p></div><div class="level"><strong>学习 · 中弱</strong><p>仅顶部标识、用户气泡和局部进度使用模式色。</p></div><div class="level"><strong>Review · 弱</strong><p>只保留模式徽标、细强调线和章节锚点。</p></div></div></section></main><script src="assets/mode-themes.js"></script><script>tokens.innerHTML=Object.entries(CourseModeThemeRegistry).map(([id,t])=>`<article class="lm-card token" style="--accent:${t.accent};--accent-dark:${t.accentDark};--tint:${t.tint}"><div class="token-head"><span class="lm-mode-icon">${t.icon}</span><div><h2>${t.label}</h2><p>${id} · ${t.subtitle}</p></div></div><div class="swatches"><div class="swatch" style="background:${t.accent}"></div><div class="swatch" style="background:${t.tint}"></div><div class="swatch" style="background:#fffdf9;border-color:${t.accent}"></div></div></article>`).join('')</script></body></html>
