<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learning MORE · 共享组件与状态色</title><link rel="icon" href="data:,"><link rel="stylesheet" href="assets/base.css"><style>.demo{padding:20px;margin-top:14px}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}.sample{padding:18px;border:1px solid var(--line);border-radius:12px}.status{padding:12px;border-left:4px solid var(--status);background:var(--status-bg);border-radius:0 9px 9px 0}.status b{font-size:11px}.status p{font-size:9px;margin:5px 0 0;color:var(--muted)}@media(max-width:700px){.compare{grid-template-columns:1fr}}</style><script defer src="assets/runtime-status.js"></script></head><body><header class="lm-topbar"><div class="lm-brand"><strong>Learning MORE</strong><span>共享组件与状态语义</span></div><a class="lm-btn" href="../README.md">返回索引</a></header><main class="lm-page"><section class="lm-card demo"><div class="lm-kicker">Identity</div><h1>模式色不等于状态色</h1><div class="compare"><div class="sample" style="--accent:#9079c1;--accent-dark:#5f4d8b;--tint:#f5f1fd"><span class="lm-mode-badge">¶ 阅读研讨</span><p>表示课程来源与体验身份。</p></div><div class="sample"><span class="lm-pill success">● 已完成</span><p>表示生命周期状态，始终使用全局成功色。</p></div></div></section><section class="lm-card demo"><h2>全局状态</h2><div class="lm-grid" style="grid-template-columns:repeat(2,1fr)"><div class="status lm-status-success"><b>已完成</b><p>最终 Review 已成功写入。</p></div><div class="status lm-status-warning"><b>生成中</b><p>等待 AI 输出或后台事务。</p></div><div class="status lm-status-danger"><b>生成失败</b><p>保留已有事实并提供安全重试。</p></div><div class="status lm-status-readonly"><b>永久只读</b><p>最终 Review 与关闭课程档案不可修改。</p></div></div></section><section class="lm-card demo"><h2>共享操作</h2><div class="row"><button class="lm-btn">次要操作</button><button class="lm-btn primary">主操作</button><button class="lm-btn danger">危险操作</button><span class="lm-pill">中性标签</spa
