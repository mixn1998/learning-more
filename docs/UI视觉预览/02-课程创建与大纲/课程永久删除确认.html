<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Learning MORE · 永久删除课程</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../00-设计系统/assets/base.css" />
    <script defer src="../00-设计系统/assets/sample-ui.js"></script>
    <style>
      body {
        min-height: 100vh;
        overflow-x: hidden;
      }
      .lm-topbar {
        position: static;
      }
      .preview-page {
        width: 100%;
        min-width: 0;
        min-height: calc(100vh - 72px);
        padding: 28px;
        position: relative;
        overflow: hidden;
      }
      .course-preview {
        width: 100%;
        min-width: 0;
        max-width: 1600px;
        margin: 0 auto;
        padding: 28px;
        display: grid;
        gap: 18px;
        filter: blur(1px);
      }
      .course-preview .hero {
        min-height: 230px;
        padding: 26px;
        display: flex;
        justify-content: space-between;
        gap: 20px;
      }
      .course-preview h1 {
        margin: 7px 0;
        font-size: clamp(28px, 3vw, 42px);
        line-height: 1.24;
      }
      .course-preview p {
        margin: 0;
        color: var(--muted);
      }
      .course-preview .preview-actions {
        display: flex;
        gap: 9px;
        align-items: flex-start;
      }
      .preview-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 292px;
        gap: 14px;
      }
      .preview-panel {
        min-width: 0;
        max-width: 100%;
        min-height: 360px;
        padding: 22px;
      }
      .preview-lines {
        display: grid;
        gap: 12px;
        margin-top: 20px;
      }
      .preview-line {
        height: 68px;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: #fff;
      }
      .preview-shade {
        position: absolute;
        inset: 0;
        background: rgba(43, 38, 33, 0.44);
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .delete-course-dialog {
        width: min(560px, 100%);
        overflow: hidden;
        border: 1px solid #e4c1bb;
        border-radius: 16px;
        background: var(--paper);
        color: var(--ink);
        box-shadow: 0 28px 70px rgba(34, 24, 19, 0.32);
      }
      .delete-course-dialog header,
      .delete-course-body,
      .delete-course-dialog footer {
        padding: 22px 24px;
      }
      .delete-course-dialog header {
        border-bottom: 1px solid var(--line);
      }
      .delete-course-dialog h1 {
        margin: 5px 0 0;
        font-size: 26px;
        line-height: 1.3;
      }
      .delete-course-body {
        display: grid;
        gap: 12px;
      }
      .delete-course-body p {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.7;
      }
      .delete-course-body strong {
        color: var(--ink);
      }
      .delete-course-note {
        padding: 12px 13px;
        border: 1px solid #eccbc6;
        border-radius: 10px;
        background: var(--danger-bg);
        color: var(--danger) !important;
      }
      .delete-course-dialog footer {
        display: flex;
        justify-content: flex-end;
        gap: 9px;
        border-top: 1px solid var(--line);
        background: var(--paper-2);
      }
      @media (max-width: 760px) {
        .preview-page {
          padding: 12px;
        }
        .course-preview {
          padding: 0;
        }
        .preview-grid {
          grid-template-columns: 1fr;
        }
        .course-preview .hero {
          min-height: 190px;
          min-width: 0;
          max-width: 100%;
          flex-direction: column;
          overflow: hidden;
        }
        .course-preview .hero > div {
          min-width: 0;
          max-width: 100%;
        }
        .course-preview .preview-actions {
          flex-wrap: wrap;
        }
        .delete-course-dialog {
          max-width: 100%;
        }
        .delete-course-dialog footer {
          flex-wrap: wrap;
        }
        .delete-course-dialog header,
        .delete-course-body,
        .delete-course-dialog footer {
          padding: 18px;
        }
      }
    </style>
  </head>
  <body>
    <header class="lm-topbar">
      <div class="lm-brand"><strong>Learning MORE</strong><span>正式课程学习档案</span></div>
    </header>
    <main class="preview-page">
      <div class="course-preview" aria-hidden="true">
        <section class="lm-card hero">
          <div>
            <div class="lm-kicker">STANDARD · 正式课程</div>
            <h1>从反馈到核心循环：游戏设计能力进阶</h1>
            <p>艺术与设计 · 游戏设计、核心循环 · 大纲 v1</p>
          </div>
          <div class="preview-actions">
            <span class="lm-btn">返回主页</span><span class="lm-btn">切换课程</span><span class="lm-btn">修改大纲</span>
          </div>
        </section>
        <div class="preview-grid">
          <section class="lm-card preview-panel">
            <h2>课程单元</h2>
            <div class="preview-lines"><div class="preview-line"></div><div class="preview-line"></div><div class="preview-line"></div></div>
          </section>
          <aside class="lm-card preview-panel"><h2>课程进度</h2></aside>
        </div>
      </div>
      <div class="preview-shade">
        <section class="delete-course-dialog" role="dialog" aria-modal="true" aria-labelledby="deleteCourseTitle">
          <header>
            <div class="lm-kicker">课程管理</div>
            <h1 id="deleteCourseTitle">永久删除课程？</h1>
          </header>
          <div class="delete-course-body">
            <p>将永久删除 <strong>《从反馈到核心循环：游戏设计能力进阶》</strong> 的课程档案、课节学习记录、Review 与课程排期。</p>
            <p class="delete-course-note">此操作不可恢复。历史统计会从底层事实中扣除此课程；已经保存的学习笔记仍会保留。</p>
          </div>
          <footer>
            <button class="lm-btn" id="cancelCourseDeletion" type="button">取消</button>
            <button class="lm-btn danger" id="confirmCourseDeletion" type="button">永久删除</button>
          </footer>
        </section>
      </div>
    </main>
    <script>
      const cancelCourseDeletion = document.getElementById('cancelCourseDeletion');
      const confirmCourseDeletion = document.getElementById('confirmCourseDeletion');
      cancelCourseDeletion.addEventListener('click', () => {
        location.href = './正式课程大纲.html';
      });
      confirmCourseDeletion.addEventListener('click', () => {
        if (confirmCourseDeletion.disabled) return;
        confirmCourseDeletion.disabled = true;
        confirmCourseDeletion.textContent = '正在删除…';
        window.setTimeout(() => {
          location.href = '../01-主页与全局导航/主页.html?simDeletedCourse=course_game_design';
        }, 360);
      });
    </script>
  </body>
</html>
