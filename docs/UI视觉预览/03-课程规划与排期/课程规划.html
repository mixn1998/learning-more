<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Learning MORE · 课程规划</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../00-设计系统/assets/base.css">
  <style>
    .hero{padding:24px 26px;display:flex;justify-content:space-between;align-items:center;gap:20px}.hero h1{margin:6px 0 0;font-size:32px;line-height:1.2}
    .planner-layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;margin-top:16px;height:calc(100vh - 196px);min-height:680px;align-items:stretch}
    .days{position:sticky;top:88px;height:100%;padding:16px;display:grid;grid-template-rows:auto repeat(7,minmax(0,1fr));gap:8px;overflow:hidden}.days header{padding:2px 2px 10px;border-bottom:1px solid var(--line)}.days header b{font-size:16px}.day{min-height:0;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);text-align:left;cursor:pointer;overflow:hidden}.day:hover{border-color:var(--accent)}.day.active{border-color:var(--accent);background:var(--tint);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 10%,transparent)}.day small{display:block;color:var(--muted);font-size:11px}.day b{display:block;margin:2px 0 5px;font-size:15px}.day span{display:-webkit-box;color:var(--muted);font-size:11px;line-height:1.45;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .main{height:100%;padding:20px;overflow-y:auto;scrollbar-gutter:stable}.main-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-end}.main-head h2{margin:0;font-size:24px}.main-head p{margin:4px 0 0;color:var(--muted);font-size:12px}
    .filters{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;margin-top:15px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--paper-2)}
    .lesson-list{display:grid;gap:10px;margin-top:14px}.lesson{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;padding:17px 18px;border:1px solid var(--line);border-radius:12px;background:#fff}.lesson h3{margin:0;font-size:16px;line-height:1.4}.lesson p{margin:5px 0 9px;color:var(--muted);font-size:12px}.lesson-actions{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}.date-btn{min-width:168px}.planned .date-btn{border-color:var(--accent);color:var(--accent-dark);background:var(--tint)}
    dialog{width:min(660px,calc(100% - 28px));padding:0;border:1px solid var(--line);border-radius:17px;background:var(--paper);color:var(--ink);box-shadow:0 28px 70px rgba(57,42,29,.24)}dialog::backdrop{background:rgba(44,38,32,.42)}.dialog-head,.dialog-body,.dialog-foot{padding:20px 22px}.dialog-head{border-bottom:1px solid var(--line)}.dialog-head h2{margin:6px 0 0;font-size:24px}.dialog-body{display:grid;gap:10px}.knowledge-point{padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:#fff}.knowledge-point b{font-size:14px}.dialog-foot{display:flex;justify-content:flex-end;gap:9px;border-top:1px solid var(--line);background:var(--paper-2)}
    @media(max-width:900px){.planner-layout{grid-template-columns:240px 1fr}.filters{grid-template-columns:1fr}.lesson{grid-template-columns:1fr}.lesson-actions{justify-content:flex-start}}
    @media(max-width:720px){.hero{align-items:flex-start;flex-direction:column}.planner-layout{display:block;height:auto;min-height:0}.days{position:static;height:auto;margin-bottom:12px;grid-template-columns:repeat(2,1fr);grid-template-rows:auto;overflow:visible}.days header{grid-column:1/-1}.day{min-height:104px}.main{height:auto;overflow:visible}.lesson-actions{display:grid;grid-template-columns:1fr}.date-btn{min-width:0}.dialog-foot{flex-direction:column-reverse}.dialog-foot .lm-btn{width:100%}}
  </style>
  <script defer src="../00-设计系统/assets/runtime-status.js"></script>
  <script defer src="../00-设计系统/assets/sample-ui.js"></script>
</head>
<body>
  <header class="lm-topbar">
    <div class="lm-brand"><strong>Learning MORE</strong><span>课程规划</span></div>
    <div class="lm-runtime"><span class="lm-pill" id="todayCount">今日待学 2</span><span class="lm-pill warning" id="unplannedCount">待规划 3</span></div>
  </header>
  <main class="lm-page">
    <section class="lm-card hero">
      <div><div class="lm-kicker">COURSE PLANNING</div><h1>安排课节学习日期</h1></div>
      <div class="lm-actions"><a class="lm-btn primary" href="计划流向导与管理.html">生成计划流</a><a class="lm-btn" href="../01-主页与全局导航/主页.html">返回课程表</a></div>
    </section>

    <div class="planner-layout">
      <aside class="lm-card days" id="days"><header><b>今日起 7 天</b></header></aside>
      <section class="lm-card main">
        <header class="main-head"><div><h2>待安排与已安排课节</h2><p id="summary"></p></div></header>
        <div class="filters">
          <select class="lm-control" id="statusFilter"><option value="">全部排期状态</option><option value="待规划">待规划</option><option value="已安排">已安排</option></select>
          <select class="lm-control" id="topicFilter"><option value="">全部主题标签</option><option>游戏反馈</option><option>数据结构</option><option>原型验证</option></select>
          <button class="lm-btn" id="clearFilter">清除筛选</button>
        </div>
        <div class="lesson-list" id="lessonList"></div>
      </section>
    </div>
  </main>

  <dialog id="previewDialog">
    <div class="dialog-head"><div class="lm-kicker">核心知识点</div><h2 id="previewTitle"></h2></div>
    <div class="dialog-body" id="previewPoints"></div>
    <div class="dialog-foot"><button class="lm-btn" id="closePreview">关闭</button></div>
  </dialog>

  <dialog id="scheduleDialog">
    <div class="dialog-head"><div class="lm-kicker">学习日期</div><h2 id="scheduleTitle"></h2></div>
    <div class="dialog-body"><label class="lm-field"><span>学习日期</span><input class="lm-control" id="scheduleDate" type="date" min="2026-07-12"></label></div>
    <div class="dialog-foot"><button class="lm-btn" id="cancelScheduleDialog">取消</button><button class="lm-btn primary" id="confirmSchedule">确认日期</button></div>
  </dialog>

  <script>
    const lessons=[
      {id:'l1',title:'树为什么适合表达层级关系',course:'数据结构入门',topic:'数据结构',status:'待规划',date:'',minutes:28,points:['节点与边','父子关系','递归结构']},
      {id:'l2',title:'如何为原型建立验证指标',course:'游戏设计能力',topic:'原型验证',status:'待规划',date:'',minutes:18,points:['判断标准','行为证据','迭代条件']},
      {id:'l3',title:'核心循环与玩家动机',course:'游戏设计能力',topic:'游戏反馈',status:'已安排',date:'2026-07-13',minutes:20,points:['玩家行动','系统反馈','下一步欲望']},
      {id:'l4',title:'栈与队列如何约束操作顺序',course:'数据结构入门',topic:'数据结构',status:'已安排',date:'2026-07-14',minutes:26,points:['后进先出','先进先出','场景匹配']},
      {id:'l5',title:'反馈如何改变玩家下一步行动',course:'游戏设计能力',topic:'游戏反馈',status:'已安排',date:'2026-07-12',minutes:24,points:['状态反馈','能力反馈','目标反馈']},
      {id:'l6',title:'建立可验证的成功标准',course:'游戏设计能力',topic:'原型验证',status:'已安排',date:'2026-07-12',minutes:18,points:['观察指标','测试任务','迭代决策']},
      {id:'l7',title:'图如何表达多对多关系',course:'数据结构入门',topic:'数据结构',status:'待规划',date:'',minutes:31,points:['节点连接','方向与权重','遍历路径']},
    ];
    const dates=[['周日 · 今天','07/12','2026-07-12'],['周一','07/13','2026-07-13'],['周二','07/14','2026-07-14'],['周三','07/15','2026-07-15'],['周四','07/16','2026-07-16'],['周五','07/17','2026-07-17'],['周六','07/18','2026-07-18']];
    let selectedDate='2026-07-12';
    let editingLessonId=null;
    const days=document.getElementById('days');
    const lessonList=document.getElementById('lessonList');
    const summary=document.getElementById('summary');
    const statusFilter=document.getElementById('statusFilter');
    const topicFilter=document.getElementById('topicFilter');
    const previewDialog=document.getElementById('previewDialog');
    const scheduleDialog=document.getElementById('scheduleDialog');

    function renderDays(){
      days.querySelectorAll('.day').forEach((node)=>node.remove());
      dates.forEach(([label,short,iso])=>{
        const titles=lessons.filter((lesson)=>lesson.date===iso).map((lesson)=>lesson.title);
        const button=document.createElement('button');
        button.type='button';
        button.className=`day${selectedDate===iso?' active':''}`;
        button.dataset.date=iso;
        button.innerHTML=`<small>${label}</small><b>${short}</b><span>${titles.join(' · ')||'暂无安排'}</span>`;
        button.addEventListener('click',()=>{
          selectedDate=iso;
          statusFilter.value='';
          topicFilter.value='';
          renderDays();
          renderLessons();
        });
        days.appendChild(button);
      });
    }

    function visibleLessons(){
      if(selectedDate) return lessons.filter((lesson)=>lesson.date===selectedDate);
      return lessons.filter((lesson)=>(!statusFilter.value||lesson.status===statusFilter.value)&&(!topicFilter.value||lesson.topic===topicFilter.value));
    }

    function renderLessons(){
      const items=visibleLessons();
      summary.textContent=`${selectedDate||'当前筛选'} · ${items.length} 节`;
      lessonList.innerHTML=items.length?items.map((lesson)=>`
        <article class="lesson ${lesson.status==='已安排'?'planned':''}">
          <div><h3>${lesson.title}</h3><p>《${lesson.course}》· ${lesson.status==='待规划'?'尚未安排':lesson.date} · ${lesson.minutes} 分钟</p><div class="lm-chips"><span class="lm-pill">${lesson.status}</span><span class="lm-pill">${lesson.topic}</span></div></div>
          <div class="lesson-actions"><button class="lm-btn date-btn" data-schedule="${lesson.id}">${lesson.date||'点击安排学习日期'}</button>${lesson.date?`<button class="lm-btn" data-unschedule="${lesson.id}">取消排期</button>`:''}<button class="lm-btn" data-preview="${lesson.id}">预览</button></div>
        </article>`).join(''):'<div class="lm-empty">当前没有符合条件的课节</div>';
      lessonList.querySelectorAll('[data-preview]').forEach((button)=>button.addEventListener('click',()=>openPreview(button.dataset.preview,button)));
      lessonList.querySelectorAll('[data-schedule]').forEach((button)=>button.addEventListener('click',()=>openSchedule(button.dataset.schedule,button)));
      lessonList.querySelectorAll('[data-unschedule]').forEach((button)=>button.addEventListener('click',()=>cancelLessonSchedule(button.dataset.unschedule)));
      document.getElementById('unplannedCount').textContent=`待规划 ${lessons.filter((lesson)=>!lesson.date).length}`;
      document.getElementById('todayCount').textContent=`今日待学 ${lessons.filter((lesson)=>lesson.date==='2026-07-12').length}`;
    }

    function openPreview(id,trigger){
      const lesson=lessons.find((item)=>item.id===id);
      document.getElementById('previewTitle').textContent=lesson.title;
      document.getElementById('previewPoints').innerHTML=lesson.points.map((point,index)=>`<div class="knowledge-point"><b>${String(index+1).padStart(2,'0')} · ${point}</b></div>`).join('');
      SampleUI.openDialog(previewDialog,trigger);
    }

    function openSchedule(id,trigger){
      const lesson=lessons.find((item)=>item.id===id);
      editingLessonId=id;
      document.getElementById('scheduleTitle').textContent=lesson.title;
      document.getElementById('scheduleDate').value=lesson.date||selectedDate||'2026-07-13';
      SampleUI.openDialog(scheduleDialog,trigger);
    }

    async function cancelLessonSchedule(id){
      const lesson=lessons.find((item)=>item.id===id);
      const accepted=await SampleUI.confirm({title:'取消课节排期？',message:`“${lesson.title}”将回到待规划状态。`,confirmText:'取消排期',tone:'danger'});
      if(!accepted) return;
      lesson.date='';
      lesson.status='待规划';
      renderDays();
      renderLessons();
      SampleUI.showToast('课节已回到待规划','success');
    }

    statusFilter.addEventListener('change',()=>{selectedDate='';renderDays();renderLessons()});
    topicFilter.addEventListener('change',()=>{selectedDate='';renderDays();renderLessons()});
    document.getElementById('clearFilter').addEventListener('click',()=>{selectedDate='';statusFilter.value='';topicFilter.value='';renderDays();renderLessons()});
    document.getElementById('closePreview').addEventListener('click',()=>SampleUI.closeDialog(previewDialog));
    document.getElementById('cancelScheduleDialog').addEventListener('click',()=>SampleUI.closeDialog(scheduleDialog));
    document.getElementById('confirmSchedule').addEventListener('click',()=>{
      const date=document.getElementById('scheduleDate').value;
      if(!date){SampleUI.showToast('请选择学习日期','warning');return}
      const lesson=lessons.find((item)=>item.id===editingLessonId);
      lesson.date=date;
      lesson.status='已安排';
      SampleUI.closeDialog(scheduleDialog);
      renderDays();
      renderLessons();
      SampleUI.showToast('学习日期已更新','success');
    });
    renderDays();
    renderLessons();
  </script>
</body>
</html>
